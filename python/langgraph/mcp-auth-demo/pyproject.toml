[project]
name = "mcp-auth-demo"
version = "0.1.0"
description = "Demo of user-scoped MCP authentication with Supabase Vault and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.1.8",
    "langchain-openai>=0.3.27",
    "langgraph>=0.5.1",
    "langgraph-cli[inmem]>=0.3.3",
    "python-dotenv>=1.1.1",
    "supabase>=2.16.0",
]

[tool.setuptools]
py-modules = ["agent", "auth", "setup_database", "setup_secrets"]
