[project]
name = "langgraph-mcp"
version = "1.0.0"
description = "LangGraph Solution Template for MCP"
authors = [
    { name = "Heuris Labs", email = "hello@heuris.co" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sse-starlette>=2.1.0,<2.2.0",
    "asyncio",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
    "mcp[cli]",
    "openai",
    "python-dotenv",
    "pydantic>=2.6",
    "langchain-anthropic>=0.3.15",
    "requests>=2.32.3",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "langgraph-cli[inmem]>=0.3.1",
    "langsmith>=0.3.37",
    "psycopg[binary,pool]>=3.2.9",
    "langgraph-checkpoint-postgres>=2.0.23",
    "msgpack>=1.1.1",
    "deepagents",
]

[project.optional-dependencies]
dev = ["debugpy", "mypy", "ruff", "langgraph-cli[inmem]"]
test = ["pytest", "langgraph-sdk", "requests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph_mcp", "deepagent_mcp", "simple_agent"]

[tool.setuptools.package-dir]
"langgraph_mcp" = "src/langgraph_mcp"
"deepagent_mcp" = "src/deepagent_mcp"
"simple_agent" = "src/simple_agent"

